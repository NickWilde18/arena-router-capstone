model:
  base: jhu-clsp/mmBERT-base
  # Train-set token-length distribution: median 16, p99 532, max 1675.
  # docs §4 example uses 2048; that wastes ~98% compute on padding here.
  # 512 covers 99% naturally; 1.17% rows truncated (tail mostly long instructions
  # whose first 512 tokens still carry the routing signal).
  max_length: 512               # docs §4: 2048; reduced based on data distribution

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # docs §4 says [query, key, value, dense] (vanilla BERT names).
  # mmBERT is ModernBERT: fused Wqkv + GLU MLP (Wi/Wo) + attn-out `dense`.
  # Probe confirmed Linear suffixes are {Wqkv, Wo, Wi, dense, classifier}.
  # Old config matched only `dense` (1 module/layer) -> 0.013% trainable, sub-majority baseline.
  target_modules: [Wqkv, Wo, Wi, dense]
  task_type: SEQ_CLS

training:
  output_dir: outputs/adapter_v2_kl_arch_fixed
  # Sub-majority baselines (top1 0.10) traced to wrong LoRA target_modules
  # for ModernBERT; see lora.target_modules note. Hparams below kept identical
  # to run #2 (lr=5e-5, 5ep, warmup=0.1) so this run isolates the arch fix axis.
  num_train_epochs: 5                   # docs §4: 3
  # Larger batches saturate Tensor Cores on RTX 4070 (was 50W at batch=32).
  # gradient_checkpointing trades ~30% per-step compute for ~40% activation
  # memory savings, enabling batch=64 within 12 GB budget.
  per_device_train_batch_size: 64      # RTX 4070 12GB; drop to 8 on MPS
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 1
  gradient_checkpointing: true
  learning_rate: 5.0e-5                 # docs §4: 2e-4 (LoRA generic); too high for 20-class head
  warmup_ratio: 0.1                     # docs §4: 0.06; raised in line with lower lr
  weight_decay: 0.01
  # ModernBERT recommends bf16 over fp16 (more stable for GeLU/GeGLU).
  bf16: true                            # docs §4 says fp16; ModernBERT prefers bf16
  fp16: false
  eval_strategy: steps                  # transformers 5.x renamed from evaluation_strategy
  eval_steps: 500
  save_steps: 500
  logging_steps: 50
  load_best_model_at_end: true
  metric_for_best_model: top1_accuracy
  greater_is_better: true
  # Throughput: cluster similar-length samples in each batch (cuts padding waste
  # 5-10x given heavy length skew: median 16, p99 532). Also parallel tokenization.
  group_by_length: true
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  # torch.compile + PEFT crashes save_pretrained with
  # `KeyError: modules_to_save.default.weight` because compile-wrapped state
  # keys differ. Disable until accelerator.unwrap_model honors our manual wrap.
  torch_compile: false

loss:
  type: kl_div                  # 'kl_div' | 'cross_entropy'
  use_soft_label: true
  class_weight: null            # 'inv_freq' | null

data:
  train_file: data/processed/train.jsonl
  val_file:   data/processed/val.jsonl
  test_file:  data/processed/test.jsonl
  label2id_file: data/processed/label2id.json

seed: 42
