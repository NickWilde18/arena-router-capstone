[project]
name = "arena-router-capstone"
version = "0.1.0"
description = "mmBERT-based prompt → best-model classifier for vLLM Semantic Router (DDA 4080 Capstone)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Nick Wilde", email = "yechiyang93@gmail.com" }]
license = { text = "Apache-2.0" }

dependencies = [
    "datasets>=3.0",
    "transformers>=4.46",
    "peft>=0.13",
    "torch>=2.5",
    "accelerate>=1.0",
    "evaluate>=0.4",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
    "tiktoken>=0.8",
    "pyarrow>=18.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9", "seaborn>=0.13", "wandb>=0.18"]
dev  = ["ipython", "jupyter", "ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
